# Studio - Production
# Pre-built images from GHCR. No build: directives.
# GPU workers: docker compose -f docker-compose.yml -f workers/docker-compose.gpu.yml up -d
#
# Usage:
#   docker compose up -d                           # Core (postgres + api + ui + nginx)
#   docker compose --profile worker-general up -d  # Core + a specific worker
#   docker compose --profile workers up -d         # Core + all workers (if using COMPOSE_PROFILES)
#
# nginx is always the front door on SHS_NGINX_PORT (default 80).
# api and ui are internal - not bound to host ports.
# Scaling is handled by console via docker-compose.override.yml.

services:
  postgres:
    image: pgvector/pgvector:0.8.3-pg18-trixie@sha256:6232c5ea178707f278d060b51747c30f310164595674e95d5f9d100f4a48b56c

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: selfhost_studio
      PGDATA: /var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${SHS_WORKSPACE_HOST:?SHS_WORKSPACE_HOST is required}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - prod-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  api:
    image: ghcr.io/selfhosthub/studio-api:${SHS_STUDIO_VERSION:?SHS_STUDIO_VERSION is required - set in .env}
    # uid/gid contract: containers write the bind mounts as the host user that owns them
    user: "${SHS_RUN_UID:-1000}:${SHS_RUN_GID:-1000}"

    environment:
      - SHS_WORKSPACE_ROOT=/workspace
    ports:
      # Localhost-only API publish for native same-host workers.
      - "127.0.0.1:8000:8000"
    volumes:
      - ${SHS_WORKSPACE_HOST:?SHS_WORKSPACE_HOST is required}:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - prod-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  ui:
    image: ghcr.io/selfhosthub/studio-ui:${SHS_STUDIO_VERSION:?SHS_STUDIO_VERSION is required - set in .env}

    environment:
      - NEXT_PUBLIC_API_URL=${SHS_API_BASE_URL:?SHS_API_BASE_URL is required - set in .env}
      - NEXT_PUBLIC_WS_URL=${SHS_WS_URL:?SHS_WS_URL is required - set in .env}
      - NEXT_PUBLIC_API_ENV=production
      - SHS_API_BASE_URL=${SHS_API_BASE_URL}
      - SHS_WS_URL=${SHS_WS_URL}
    depends_on:
      - api
    networks:
      - prod-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    ports:
      - "${SHS_NGINX_PORT:-80}:80"
    volumes:
      - ${SHS_WORKSPACE_HOST:?SHS_WORKSPACE_HOST is required}/nginx/studio.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_started
        required: false
      ui:
        condition: service_started
        required: false
    healthcheck:
      # 127.0.0.1, not localhost: /etc/hosts resolves localhost to ::1 and nginx listens on IPv4 only.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - prod-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ===========================================================================
  # Workers - each has its own profile, activated via COMPOSE_PROFILES in .env
  # ===========================================================================

  worker-general:
    image: ghcr.io/selfhosthub/studio-worker-general:${SHS_STUDIO_VERSION:?SHS_STUDIO_VERSION is required - set in .env}
    user: "${SHS_RUN_UID:-1000}:${SHS_RUN_GID:-1000}"

    profiles: [worker-general]

    environment:
      - SHS_API_BASE_URL=http://api:8000
      - SHS_PUBLIC_BASE_URL=${SHS_PUBLIC_BASE_URL:?SHS_PUBLIC_BASE_URL is required - set in .env}
      - SHS_WORKER_SHARED_SECRET=${SHS_WORKER_SHARED_SECRET:?SHS_WORKER_SHARED_SECRET is required - set in .env}
      - SHS_WORKSPACE_ROOT=/workspace
      - SHS_WORKER_TYPE=general
    volumes:
      - ${SHS_WORKSPACE_HOST:?SHS_WORKSPACE_HOST is required}:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - prod-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  worker-transfer:
    image: ghcr.io/selfhosthub/studio-worker-transfer:${SHS_STUDIO_VERSION:?SHS_STUDIO_VERSION is required - set in .env}
    user: "${SHS_RUN_UID:-1000}:${SHS_RUN_GID:-1000}"

    profiles: [worker-transfer]

    environment:
      - SHS_API_BASE_URL=http://api:8000
      - SHS_PUBLIC_BASE_URL=${SHS_PUBLIC_BASE_URL:?SHS_PUBLIC_BASE_URL is required - set in .env}
      - SHS_WORKER_SHARED_SECRET=${SHS_WORKER_SHARED_SECRET:?SHS_WORKER_SHARED_SECRET is required - set in .env}
      - SHS_WORKSPACE_ROOT=/workspace
      - SHS_WORKER_TYPE=transfer
    volumes:
      - ${SHS_WORKSPACE_HOST:?SHS_WORKSPACE_HOST is required}:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - prod-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  worker-video:
    image: ghcr.io/selfhosthub/studio-worker-video:${SHS_STUDIO_VERSION:?SHS_STUDIO_VERSION is required - set in .env}
    user: "${SHS_RUN_UID:-1000}:${SHS_RUN_GID:-1000}"

    profiles: [worker-video]

    environment:
      - SHS_API_BASE_URL=http://api:8000
      - SHS_PUBLIC_BASE_URL=${SHS_PUBLIC_BASE_URL:?SHS_PUBLIC_BASE_URL is required - set in .env}
      - SHS_WORKER_SHARED_SECRET=${SHS_WORKER_SHARED_SECRET:?SHS_WORKER_SHARED_SECRET is required - set in .env}
      - SHS_WORKSPACE_ROOT=/workspace
      - SHS_WORKER_TYPE=video
      - SHS_WHISPER_MODEL=${SHS_WHISPER_MODEL:-base}
      # Whisper model files land here instead of container-local scratch, so they
      # survive a recreate and are shared by every worker on the same volume.
      - XDG_CACHE_HOME=/workspace/models
    volumes:
      - ${SHS_WORKSPACE_HOST:?SHS_WORKSPACE_HOST is required}:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - prod-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  worker-audio:
    image: ghcr.io/selfhosthub/studio-worker-audio:${SHS_STUDIO_VERSION:?SHS_STUDIO_VERSION is required - set in .env}
    user: "${SHS_RUN_UID:-1000}:${SHS_RUN_GID:-1000}"

    profiles: [worker-audio]

    environment:
      - SHS_API_BASE_URL=http://api:8000
      - SHS_PUBLIC_BASE_URL=${SHS_PUBLIC_BASE_URL:?SHS_PUBLIC_BASE_URL is required - set in .env}
      - SHS_WORKER_SHARED_SECRET=${SHS_WORKER_SHARED_SECRET:?SHS_WORKER_SHARED_SECRET is required - set in .env}
      - SHS_WORKSPACE_ROOT=/workspace
      - SHS_WORKER_TYPE=audio
      - HF_HOME=/workspace/models/huggingface
      # 0 = never evict (default, unchanged behaviour). Set to e.g. 300 and an idle
      # worker drops Chatterbox and hands its VRAM back, so ComfyUI on the same GPU
      # is not squeezed by a model nothing is using.
      - SHS_AUDIO_MODEL_IDLE_SECONDS=${SHS_AUDIO_MODEL_IDLE_SECONDS:-0}
    volumes:
      - ${SHS_WORKSPACE_HOST:?SHS_WORKSPACE_HOST is required}:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - prod-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ComfyUI worker (proxy to operator-managed ComfyUI server)
  # Deploy with SHS_WORKER_TYPE=comfyui-image (default) or SHS_WORKER_TYPE=comfyui-video
  worker-comfyui-image:
    image: ghcr.io/selfhosthub/studio-worker-comfyui:${SHS_STUDIO_VERSION:?SHS_STUDIO_VERSION is required - set in .env}
    user: "${SHS_RUN_UID:-1000}:${SHS_RUN_GID:-1000}"

    profiles: [worker-comfyui-image]

    environment:
      - SHS_API_BASE_URL=http://api:8000
      - SHS_PUBLIC_BASE_URL=${SHS_PUBLIC_BASE_URL:?SHS_PUBLIC_BASE_URL is required - set in .env}
      - SHS_WORKER_SHARED_SECRET=${SHS_WORKER_SHARED_SECRET:?SHS_WORKER_SHARED_SECRET is required - set in .env}
      - SHS_WORKSPACE_ROOT=/workspace
      - SHS_WORKER_TYPE=comfyui-image
      - SHS_COMFYUI_URL=${SHS_COMFYUI_URL:-}
    volumes:
      - ${SHS_WORKSPACE_HOST:?SHS_WORKSPACE_HOST is required}:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - prod-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ===========================================================================
  # Cloudflare Tunnel - activated via COMPOSE_PROFILES=cloudflared
  # ===========================================================================

  cloudflared:
    image: cloudflare/cloudflared:2026.8.1@sha256:d9ff527dc19799e24d3689058161fb01e752a24be1823577bae54c9c2489275f
    profiles: [cloudflared]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - nginx
    networks:
      - prod-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  prod-network:
    driver: bridge
