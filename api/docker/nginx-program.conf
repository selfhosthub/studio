[program:nginx]
command=/usr/local/bin/nginx-start.sh
autostart=true
autorestart=true
startretries=5
startsecs=5
numprocs=1
process_name=%(program_name)s
stderr_logfile=/var/log/supervisor/%(program_name)s_stderr.log
stderr_logfile_maxbytes=10MB
stdout_logfile=/var/log/supervisor/%(program_name)s_stdout.log
stdout_logfile_maxbytes=10MB
; Front door starts after api(30)/ui(40) so upstreams are usually up first;
; nginx retries on 502 regardless, so strict ordering isn't required.
priority=50
; nginx graceful-stops on QUIT; group signaling matches api/ui/workers so a
; restart always releases the listen port before re-bind.
stopsignal=QUIT
stopwaitsecs=10
stopasgroup=true
killasgroup=true
